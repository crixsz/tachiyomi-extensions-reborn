name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Extensions published by this repo. Add or remove "lang/name" entries here.
  CI_MODULES: "all/nhentai,en/hentai2read,en/multporn"
  REPO_BRANCH: repo

jobs:
  build:
    name: Build extensions
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Missing SIGNING_KEY repository secret. See REPO.md."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build extensions
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk
          find src -path '*/build/outputs/apk/release/*.apk' -exec cp {} apk/ \;
          ls -l apk

      - name: Download extension inspector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSPECTOR_URL="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/tachiyomiorg/tachiyomi-extensions-inspector/releases/latest \
            | jq -r '.assets[0].browser_download_url')"
          if [ -z "$INSPECTOR_URL" ] || [ "$INSPECTOR_URL" = "null" ]; then
            INSPECTOR_URL="https://github.com/tachiyomiorg/tachiyomi-extensions-inspector/releases/download/v1.4.2/Tachiyomi.Extensions.Inspector-v1.4.2-r1.jar"
          fi
          curl -fL "$INSPECTOR_URL" -o Inspector.jar
          ls -l Inspector.jar

      - name: Read extension metadata
        run: java -jar Inspector.jar "apk" "output.json" "tmp"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            apk/*.apk
            output.json
          retention-days: 1

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish extension repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protobuf
        run: python -m pip install --upgrade protobuf

      - name: Check out repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo-out
          cd repo-out
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin "${REPO_BRANCH}"; then
            git checkout -B "${REPO_BRANCH}" FETCH_HEAD
          else
            echo "Creating new orphan ${REPO_BRANCH} branch"
            git checkout --orphan "${REPO_BRANCH}"
          fi

      - name: Generate repo index
        env:
          SIGNING_KEY_FINGERPRINT: ec5f36ddbeae4fde1c5c9c1484b1c9dfd9ca467f9dfe8cc2c0e2bd658f859656
          REPO_DIR: ${{ github.workspace }}/repo-out
          APK_DIR: ${{ github.workspace }}/apk
          OUTPUT_JSON: ${{ github.workspace }}/output.json
          REPO_DISPLAY_NAME: Reborn Extensions
        run: python .github/scripts/publish-repo.py

      - name: Commit and push
        run: |
          cd repo-out
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update extensions repo"
          git push origin "HEAD:${REPO_BRANCH}"

      - name: Print repo URL
        run: |
          echo "Add this URL in Mihon: https://github.com/${GITHUB_REPOSITORY}/raw/${REPO_BRANCH}/index.pb"
